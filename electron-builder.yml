# Instalador do Windows (D-006: sem assinatura; D-007: atualização por instalador novo).
appId: br.com.biglake.gestao
productName: BIG LAKE Gestão
copyright: BIG LAKE Sorveteria
directories:
  output: dist
  buildResources: recursos
files:
  - out/**
  - package.json
asar: true
# D-075: o manual do Carlos (npm run manual) vai junto e abre em Configurações
extraResources:
  - from: recursos/manual/Manual-BIG-LAKE.pdf
    to: manual/Manual-BIG-LAKE.pdf
win:
  target:
    - target: nsis
      arch: [x64]
  icon: recursos/icone.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: BIG LAKE
  language: '1046'
  installerLanguages: [pt_BR]
  # Os dados ficam em %APPDATA%\BigLake e as cópias em Documentos\BigLake:
  # desinstalar ou instalar uma versão nova nunca apaga os dados.
  deleteAppDataOnUninstall: false
  artifactName: BigLake-Gestao-Instalador-${version}.${ext}
